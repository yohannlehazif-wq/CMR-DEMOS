<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Démo CMR - Simple</title>
<style>
body { font-family: Arial; padding: 20px; }
.box { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
button { padding: 10px; margin-top: 10px; width: 100%; }
.light { width: 50px; height: 50px; border-radius: 50%; margin: 10px auto; }
</style>
</head>

<body>
<div class="box">
  <h2>Détection Produits CMR (version simple)</h2>

  <label>Nom du produit :</label>
  <input id="product" type="text" style="width:100%; padding:8px">

  <p><b>Sélectionnez les mentions H :</b></p>

  <div>
    <button onclick="toggle('H340')">H340</button>
    <button onclick="toggle('H350')">H350</button>
    <button onclick="toggle('H350i')">H350i</button>
    <button onclick="toggle('H360')">H360</button>
    <button onclick="toggle('H360F')">H360F</button>
    <button onclick="toggle('H360D')">H360D</button>
  </div>

  <button onclick="analyze()">Analyser</button>

  <div id="result"></div>
</div>

<script>
let selected = [];

function toggle(code) {
  if (selected.includes(code)) {
    selected = selected.filter(c => c !== code);
  } else {
    selected.push(code);
  }
}

function analyze() {
  const CMR = ["H340","H350","H350i","H360","H360F","H360D"];
  const isCMR = selected.some(c => CMR.includes(c));

  let html = "";

  if (isCMR) {
    html += "<div class='light' style='background:red;'></div>";
    html += "<p><b>Résultat :</b> Ce produit est <span style='color:red;'>CMR</span>.</p>";
    html += "<ul><li>Substitution conseillée</li><li>EPI recommandés</li><li>Ventilation</li></ul>";
  } else {
    html += "<div class='light' style='background:green;'></div>";
    html += "<p><b>Résultat :</b> Aucun indicateur CMR détecté.</p>";
  }

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
